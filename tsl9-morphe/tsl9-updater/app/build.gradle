apply plugin: 'com.android.application'
android {
    namespace 'dev.tsl9.morphe'
    compileSdk 36
    defaultConfig {
        applicationId 'dev.tsl9.morphe'
        minSdk 23
        targetSdk 36
        versionCode 13
        versionName '0.7.4-test'
        testInstrumentationRunner 'dev.tsl9.morphe.SmokeInstrumentation'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    buildTypes { debug { applicationIdSuffix '.test'; debuggable true } }
}
