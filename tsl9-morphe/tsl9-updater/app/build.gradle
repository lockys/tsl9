apply plugin: 'com.android.application'
android {
    namespace 'com.lockys.tsl9updater'
    compileSdk 36
    defaultConfig {
        applicationId 'com.lockys.tsl9updater'
        minSdk 23
        targetSdk 36
        versionCode 9
        versionName '0.7.0-test'
        testInstrumentationRunner 'com.lockys.tsl9updater.SmokeInstrumentation'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    buildTypes { debug { applicationIdSuffix '.test'; debuggable true } }
}
