name: Portable host verification
on:
  push:
    paths:
      - 'scripts/**'
      - 'experiments/**'
      - 'analysis/**'
      - 'verify.sh'
      - '.github/workflows/portable-verification.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'experiments/**'
      - 'analysis/**'
      - 'verify.sh'
      - '.github/workflows/portable-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Publication identity
        shell: bash
        run: python scripts/verify-publication.py
      - name: Selected raw proofs and C/C++ host models
        shell: bash
        run: sh ./verify.sh --language both
